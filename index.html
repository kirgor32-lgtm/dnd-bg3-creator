<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c0a09">
<title>Кузня Героев — создание персонажа D&amp;D 5e</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=31">
<link rel="stylesheet" href="css/bg3.css?v=30">
<link rel="stylesheet" href="css/forge.css?v=30">
<link rel="stylesheet" href="css/evil.css?v=5">
<link rel="stylesheet" href="css/sheet-a4.css?v=3">
<link rel="stylesheet" href="css/skills.css?v=2">
</head>
<body>

<div class="bg-glow"></div>
<div class="bg3-motes" aria-hidden="true">
  <span></span><span></span><span></span><span></span><span></span><span></span>
</div>

<div class="landing-screen" id="landingScreen">
  <div class="landing-inner">
    <div class="landing-crest" aria-hidden="true"><span>⚒</span></div>
    <h1 class="landing-title">Кузня Героев</h1>
    <div class="bg3-divider"><span></span></div>
    <p class="landing-sub">Выкуй своего героя D&amp;D 5e в пламени горна — раса, класс, судьба и снаряжение сложатся в единый лист персонажа.</p>
    <div class="landing-btns">
      <button class="btn btn-gold btn-forge" id="btnForge">⚒ Выковать героя</button>
      <button class="btn btn-evil btn-forge" id="btnEvil">☠ Выковать зло</button>
      <button class="btn btn-skills btn-forge" id="btnSkills">📘 Библиотека навыков</button>
    </div>
    <p class="landing-evil-hint">Для мастера: вампиры, нежить и прочие противники со статблоками по правилам D&amp;D 5e</p>
  </div>
</div>

<header class="top-bar">
  <div class="brand">
    <span class="brand-icon">⚒</span>
    <span class="brand-text">Кузня Героев</span>
  </div>
  <div class="charname-display" id="headerCharName"></div>
  <button type="button" class="btn btn-evil btn-evil-top" id="btnEvilTop" title="Кузня Зла — генератор противников">☠ <span>Выковать зло</span></button>
  <button type="button" class="btn btn-skills btn-skills-top" id="btnSkillsTop" title="Библиотека навыков — кастомные скиллы">📘 <span>Навыки</span></button>
</header>

<nav class="step-rail" id="stepRail" aria-label="Шаги создания персонажа"></nav>

<main class="stage" id="stage"></main>

<footer class="nav-controls">
  <button id="btnBack" class="btn btn-ghost">← Назад</button>
  <div class="step-caption" id="stepCaption"></div>
  <button id="btnNext" class="btn btn-gold">Далее →</button>
</footer>

<div id="toast" class="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="js/data.js?v=30"></script>
<script src="js/rules.js?v=30"></script>
<script src="js/race-sheet.js?v=30"></script>
  <script src="js/race-lore.js?v=30"></script>
  <script src="js/class-lore.js?v=30"></script>
<script src="js/sheet-rules.js?v=30"></script>
<script src="js/app.js?v=34"></script>
<script src="js/forge.js?v=30"></script>
<script src="js/evil-data.js?v=1"></script>
<script src="js/evil.js?v=5"></script>
<script src="js/skills.js?v=1"></script>
</body>
</html>
